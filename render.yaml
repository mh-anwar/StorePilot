# StorePilot Render Blueprint.
# Creates one web service from the Dockerfile with a persistent disk for SQLite.
# The Shopify/Anthropic secrets have sync:false, so Render asks for them when
# the blueprint is applied; they are never committed here. The public URL comes
# from RENDER_EXTERNAL_URL, which Render sets itself. See docs/INSTALL.md.

services:
  - type: web
    name: storepilot
    runtime: docker
    plan: starter
    healthCheckPath: /healthz

    disk:
      name: storepilot-data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        value: file:/data/storepilot.sqlite
      - key: NODE_ENV
        value: production
      - key: BILLING_TEST_MODE
        value: "true"
      - key: SCOPES
        value: read_orders,read_customers,read_legal_policies,read_shopify_payments_disputes,read_shopify_payments_dispute_evidences,write_shopify_payments_dispute_evidences